[project]
name = "kvu-downloader"
version = "2.1.0"
description = "Audiobook downloader for knigavuhe.org with UV-style progress display"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "petrarka" }
]
keywords = ["audiobook", "downloader", "knigavuhe"]

dependencies = [
    "requests>=2.25.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
fallback = [
    "tqdm>=4.60.0",
]

[project.scripts]
kvu-download = "kvu:main"

[dependency-groups]
dev = [
    "tqdm>=4.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kvu"]
